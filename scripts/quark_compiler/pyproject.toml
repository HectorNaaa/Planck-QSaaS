[tool.ruff]
target-version = "py310"
exclude = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E203", "E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty]
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]
exclude = ["test"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = "."
addopts = "-v --cov=src --cov-report=term-missing"
